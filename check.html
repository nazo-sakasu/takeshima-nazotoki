<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04121a">
<title>答え合わせ｜この水族館、なんか変。</title>

<!-- ==========================================================================
     竹島水族館 なぞとき ─ 答え合わせページ
     ▼ 問題名・答え・ヒントは下の CONFIG だけ書き換えればOK
     ========================================================================== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --deep:#04121a; --teal:#0a3d52; --cream:#f5ede0; --orange:#e0673b; --lime:#c7d93a;
  --dim:rgba(245,237,224,.55); --line:rgba(199,217,58,.45);
  --serif:"Shippori Mincho",serif;
  --sans:"Zen Kaku Gothic New",system-ui,sans-serif;
  --mono:"DM Mono",ui-monospace,monospace;
}
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body{
  font-family:var(--sans); color:var(--cream); min-height:100dvh;
  /* 読みやすさ優先で背景は濃いスクリムをかける */
  background:
    linear-gradient(rgba(3,10,15,.9), rgba(3,10,15,.95)),
    url('check-bg.webp') center top / cover no-repeat fixed,
    #04121a;
  padding:0 0 60px;
}
.scan{ position:fixed; inset:0; z-index:40; pointer-events:none; mix-blend-mode:overlay; opacity:.35;
  background:repeating-linear-gradient(to bottom, rgba(255,255,255,.05) 0 1px, transparent 1px 3px); }

.wrap{ width:min(520px,100%); margin:0 auto; padding:calc(26px + env(safe-area-inset-top)) 18px 0; position:relative; z-index:2; }

/* ---- ヘッダー ---- */
header{ text-align:center; padding:6px 0 20px; }
.eyebrow{ font-family:var(--mono); font-size:10.5px; letter-spacing:.4em; color:var(--lime); padding-left:.4em; }
h1{ font-family:var(--serif); font-weight:800; font-size:clamp(24px,7vw,32px);
  letter-spacing:.14em; margin-top:8px; }
.sub{ font-size:12.5px; color:var(--dim); line-height:1.9; margin-top:10px; }

/* ---- 進捗 ---- */
.progress{ display:flex; align-items:center; justify-content:center; gap:9px; margin:16px 0 4px; }
.dot{ width:11px; height:11px; border-radius:50%; border:1.5px solid rgba(245,237,224,.3);
  transition:all .3s ease; }
.dot.ok{ background:var(--lime); border-color:var(--lime); box-shadow:0 0 10px rgba(199,217,58,.6); }
.dot.seen{ background:rgba(245,237,224,.35); border-color:rgba(245,237,224,.45); }
.count{ text-align:center; font-family:var(--mono); font-size:11px; letter-spacing:.22em; color:var(--dim); }

/* ---- 問題カード ---- */
.list{ display:flex; flex-direction:column; gap:11px; margin-top:22px; }
.card{ border:1px solid rgba(199,217,58,.16); border-radius:12px; background:rgba(6,24,33,.62);
  backdrop-filter:blur(6px); overflow:hidden; transition:border-color .3s ease, background .3s ease; }
.card.ok{ border-color:rgba(199,217,58,.5); background:rgba(12,38,34,.6); }
.card.seen{ border-color:rgba(245,237,224,.24); }

.head{ display:flex; align-items:center; gap:12px; padding:14px 15px; cursor:pointer; }
.no{ font-family:var(--mono); font-size:12px; letter-spacing:.1em; color:var(--lime);
  border:1px solid rgba(199,217,58,.4); border-radius:4px; padding:4px 7px; flex-shrink:0; }
.card.ok .no{ background:rgba(199,217,58,.16); }
.name{ flex:1; font-size:14px; letter-spacing:.03em; line-height:1.5; text-align:left; }
.state{ font-family:var(--serif); font-size:13px; letter-spacing:.08em; color:var(--dim); flex-shrink:0; }
.card.ok .state{ color:var(--lime); font-weight:700; }
.card.seen .state{ color:rgba(245,237,224,.6); }

.body{ display:none; padding:2px 15px 16px; border-top:1px dashed rgba(245,237,224,.14); }
.card.open .body{ display:block; }
.row{ display:flex; gap:8px; margin-top:13px; }
input[type=text]{ flex:1; min-width:0; font-family:var(--serif); font-size:17px; letter-spacing:.08em;
  color:var(--cream); background:rgba(0,0,0,.4); border:none; border-bottom:2px solid var(--line);
  padding:10px 10px 8px; outline:none; text-align:center; }
input[type=text]:focus{ border-color:var(--lime); }
input[type=text]::placeholder{ color:rgba(245,237,224,.25); font-size:14px; letter-spacing:.05em; }
input[type=text]:disabled{ color:var(--lime); -webkit-text-fill-color:var(--lime); opacity:1; }

.btn{ font-family:var(--sans); font-weight:700; font-size:13px; letter-spacing:.1em; color:var(--cream);
  border:1px solid rgba(233,232,0,.45); border-radius:4px; padding:10px 15px; cursor:pointer; flex-shrink:0;
  background:linear-gradient(180deg, rgba(255,255,255,.09), rgba(0,0,0,.3)), rgba(6,22,30,.6);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18); transition:border-color .2s, transform .08s; }
.btn:hover{ border-color:rgba(233,232,0,.85); }
.btn:active{ transform:translateY(2px); }
.btn.link{ background:none; border:none; box-shadow:none; color:var(--dim);
  font-size:12px; letter-spacing:.08em; padding:8px 4px; text-decoration:underline; text-underline-offset:3px; }
.btn.link:hover{ color:var(--lime); }
.subrow{ display:flex; justify-content:center; gap:14px; margin-top:8px; min-height:20px; }

.msg{ margin-top:10px; font-size:12.5px; letter-spacing:.03em; line-height:1.7; min-height:18px; text-align:center; }
.msg.err{ color:#ff8a6b; }
.msg.ok{ color:var(--lime); }
.shake{ animation:shake .4s; }
@keyframes shake{ 0%,100%{transform:none} 20%,60%{transform:translateX(-7px)} 40%,80%{transform:translateX(7px)} }

/* ---- 全問正解 ---- */
.finale{ display:none; margin-top:24px; padding:24px 20px; border-radius:14px; text-align:center;
  background:rgba(6,28,24,.72); border:1px solid rgba(199,217,58,.45);
  box-shadow:0 20px 50px rgba(0,0,0,.5); animation:rise .6s ease both; }
.finale.show{ display:block; }
@keyframes rise{ from{ opacity:0; transform:translateY(14px) } to{ opacity:1; transform:none } }
.finale h2{ font-family:var(--serif); font-weight:800; font-size:clamp(19px,5.4vw,24px); letter-spacing:.08em; }
.finale p{ font-size:13.5px; line-height:2; color:rgba(245,237,224,.85); margin-top:12px; }
.finale .mark{ color:var(--lime); font-weight:700; }

/* ---- LINE案内 ---- */
.linebox{ display:none; margin-top:24px; padding:18px 18px 17px; border-radius:12px; text-align:center;
  background:rgba(6,24,33,.6); border:1px solid rgba(6,199,85,.3); backdrop-filter:blur(6px); }
.linebox.show{ display:block; }
.linetext{ font-size:13px; line-height:1.9; color:rgba(245,237,224,.85); letter-spacing:.02em; }
.linebtn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; margin-top:12px;
  font-family:var(--sans); font-weight:700; font-size:13.5px; letter-spacing:.08em;
  color:#06251a; background:#06C755; border-radius:999px; padding:11px 24px; text-decoration:none;
  box-shadow:0 6px 18px rgba(6,199,85,.28); transition:transform .08s ease, box-shadow .2s ease; }
.linebtn:hover{ box-shadow:0 10px 26px rgba(6,199,85,.45); }
.linebtn:active{ transform:translateY(2px); }

footer{ text-align:center; margin-top:30px; font-size:11px; color:rgba(245,237,224,.35); line-height:1.9; }
.reset{ font-family:var(--mono); font-size:10px; letter-spacing:.16em; color:rgba(245,237,224,.28);
  background:none; border:none; cursor:pointer; margin-top:8px; text-decoration:underline; }
@media (prefers-reduced-motion:reduce){ *{ animation:none !important; } }
</style>
</head>
<body>
<div class="scan" aria-hidden="true"></div>

<div class="wrap">
  <header>
    <div class="eyebrow">ANSWER CHECK</div>
    <h1>答え合わせ</h1>
    <p class="sub">解けた問題の答えを入れて、確かめてみよう。</p>
    <div class="progress" id="progress" aria-hidden="true"></div>
    <div class="count" id="count">0 / 7</div>
  </header>

  <div class="list" id="list"></div>

  <div class="finale" id="finale">
    <h2>７問すべて、正解。</h2>
    <p>Q7の答え<span class="mark">【ビデオテープ】</span>を<br>館内で探し、ハガキを開こう！</p>
  </div>

  <div class="linebox" id="lineBox">
    <p class="linetext" id="lineText"></p>
    <a class="linebtn" id="lineBtn" href="#" target="_blank" rel="noopener">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 2C6.5 2 2 5.7 2 10.2c0 4 3.6 7.4 8.4 8.1.3.1.8.2.9.5.1.3.1.7 0 1l-.1.9c0 .3-.2 1 .9.6 1.1-.5 5.9-3.5 8-6C21.4 13.7 22 12 22 10.2 22 5.7 17.5 2 12 2z"/>
      </svg>LINEでヒントを見る
    </a>
  </div>

  <footer>
    <button class="reset" id="resetBtn">↻ 記録を消して最初から</button>
  </footer>
</div>

<script>
/* =====================================================================
   CONFIG ── 問題名・答え・LINEはここだけ書き換えればOK
   ・answers は複数登録可（ひらがな／カタカナ／全角半角は自動で吸収）
   ===================================================================== */

// ▼ LINEのURL（公式アカウントの友だち追加URLなど）。空にすると案内は非表示
const LINE_URL  = "https://lin.ee/totsOhQ";
const LINE_TEXT = "答えが分からないときは、LINEでヒントを確認しよう！";

const QUESTIONS = [
  { no:"Q1", name:"赤い印が示すものは？",
    answers:["現実","げんじつ"] },

  { no:"Q2", name:"写真を正しく直して、示される言葉は？",
    answers:["写真","しゃしん"] },

  { no:"Q3", name:"共通する言葉は？",
    answers:["深海","しんかい"] },

  { no:"Q4", name:"看板を元の姿に戻して、示された物は？",
    answers:["イソギンチャク","いそぎんちゃく"] },

  { no:"Q5", name:"住人たちに確認して、出てきた答えは？",
    answers:["網","アミ","あみ","アミ（網）"] },

  { no:"Q6", name:"黒く塗りつぶして、出てきた言葉は？",
    answers:["展示","てんじ","テンジ","展示（テンジ）"] },

  { no:"Q7", name:"手元にあるものが示した言葉は？",
    answers:["ビデオテープ","びでおてーぷ","VIDEOTAPE"] },
];
const LINE_NUDGE_AFTER = 2;   // 何回まちがえたらLINEヒントを案内するか
/* ===================================================================== */

const $ = s=>document.querySelector(s);
const KEY = "takeshima_check";

// 表記ゆれ吸収：空白除去／全角英数→半角／半角カナ→全角／ひらがな→カタカナ／大文字化／かっこ書きを無視
const HK={"ｶﾞ":"ガ","ｷﾞ":"ギ","ｸﾞ":"グ","ｹﾞ":"ゲ","ｺﾞ":"ゴ","ｻﾞ":"ザ","ｼﾞ":"ジ","ｽﾞ":"ズ","ｾﾞ":"ゼ","ｿﾞ":"ゾ",
"ﾀﾞ":"ダ","ﾁﾞ":"ヂ","ﾂﾞ":"ヅ","ﾃﾞ":"デ","ﾄﾞ":"ド","ﾊﾞ":"バ","ﾋﾞ":"ビ","ﾌﾞ":"ブ","ﾍﾞ":"ベ","ﾎﾞ":"ボ",
"ﾊﾟ":"パ","ﾋﾟ":"ピ","ﾌﾟ":"プ","ﾍﾟ":"ペ","ﾎﾟ":"ポ","ｳﾞ":"ヴ",
"ｱ":"ア","ｲ":"イ","ｳ":"ウ","ｴ":"エ","ｵ":"オ","ｶ":"カ","ｷ":"キ","ｸ":"ク","ｹ":"ケ","ｺ":"コ",
"ｻ":"サ","ｼ":"シ","ｽ":"ス","ｾ":"セ","ｿ":"ソ","ﾀ":"タ","ﾁ":"チ","ﾂ":"ツ","ﾃ":"テ","ﾄ":"ト",
"ﾅ":"ナ","ﾆ":"ニ","ﾇ":"ヌ","ﾈ":"ネ","ﾉ":"ノ","ﾊ":"ハ","ﾋ":"ヒ","ﾌ":"フ","ﾍ":"ヘ","ﾎ":"ホ",
"ﾏ":"マ","ﾐ":"ミ","ﾑ":"ム","ﾒ":"メ","ﾓ":"モ","ﾔ":"ヤ","ﾕ":"ユ","ﾖ":"ヨ",
"ﾗ":"ラ","ﾘ":"リ","ﾙ":"ル","ﾚ":"レ","ﾛ":"ロ","ﾜ":"ワ","ｦ":"ヲ","ﾝ":"ン",
"ｧ":"ァ","ｨ":"ィ","ｩ":"ゥ","ｪ":"ェ","ｫ":"ォ","ｬ":"ャ","ｭ":"ュ","ｮ":"ョ","ｯ":"ッ","ｰ":"ー"};
function norm(s){
  s=(s||"").trim().replace(/[（(][^）)]*[）)]/g,"");
  s=s.replace(/[ｦ-ﾝ][ﾞﾟ]?/g, m => HK[m] || HK[m[0]] || m);
  return s
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/[\s\u3000・、。]/g,"")
    .replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60))
    .toUpperCase();
}

// 進捗の保存（"ok"=正解）
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ return {}; } }
function save(st){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }
let state = load();
const wrong = {};   // 問題ごとのまちがえ回数（セッション中のみ）

/* ---- 描画 ---- */
const list=$("#list");
QUESTIONS.forEach((q,i)=>{
  const st = state[i];
  const card=document.createElement("div");
  card.className="card" + (st==="ok"?" ok":st==="seen"?" seen":"");
  card.innerHTML=`
    <div class="head" data-i="${i}">
      <span class="no">${q.no}</span>
      <span class="name">${q.name}</span>
      <span class="state" id="st${i}">${st==="ok"?"正解":st==="seen"?"確認済":"未確認"}</span>
    </div>
    <div class="body">
      <div class="row">
        <input type="text" id="in${i}" placeholder="こたえを入力"
               autocomplete="off" autocapitalize="off" spellcheck="false">
        <button class="btn" data-check="${i}">確認</button>
      </div>
      <div class="msg" id="msg${i}"></div>
    </div>`;
  list.appendChild(card);

  // すでに確認済みなら答えを表示してロック
  if(st){
    const inp=card.querySelector(`#in${i}`);
    inp.value=q.answers[0]; inp.disabled=true;
    card.querySelector(`[data-check="${i}"]`).style.display="none";
  }
});

/* ---- 開閉 ---- */
list.addEventListener("click", e=>{
  const head=e.target.closest(".head");
  if(head){
    const card=head.parentElement;
    const open=card.classList.contains("open");
    document.querySelectorAll(".card").forEach(c=>c.classList.remove("open"));
    if(!open){
      card.classList.add("open");
      const inp=card.querySelector("input");
      if(inp && !inp.disabled) setTimeout(()=>inp.focus(),200);
    }
    return;
  }
  const ci=e.target.dataset.check;
  if(ci!==undefined) check(+ci);
});
list.addEventListener("keydown", e=>{
  if(e.key==="Enter" && e.target.tagName==="INPUT"){
    check(+e.target.id.replace("in",""));
  }
});

/* ---- 判定 ---- */
function check(i){
  const q=QUESTIONS[i];
  const inp=$("#in"+i), msg=$("#msg"+i);
  const val=norm(inp.value);
  if(!val) return;
  if(q.answers.map(norm).includes(val)){
    markOk(i,"ok");
    msg.className="msg ok"; msg.textContent="正解！";
  }else{
    wrong[i]=(wrong[i]||0)+1;
    msg.className="msg err";
    msg.textContent = (wrong[i]>=LINE_NUDGE_AFTER)
      ? "ちがうみたい。LINEのヒントも見てみよう。"
      : "うーん、ちがうみたい。もう一度考えてみよう。";
    const card=inp.closest(".card");
    card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
  }
}
function markOk(i,kind){
  const q=QUESTIONS[i];
  state[i]=kind; save(state);
  const inp=$("#in"+i);
  inp.value=q.answers[0]; inp.disabled=true;
  const card=inp.closest(".card");
  card.classList.remove("seen","ok"); card.classList.add(kind);
  card.querySelector(`[data-check="${i}"]`).style.display="none";
  $("#st"+i).textContent = kind==="ok" ? "正解" : "確認済";
  renderProgress();
}

/* ---- 進捗表示 ---- */
function renderProgress(){
  const p=$("#progress"); p.innerHTML="";
  let done=0;
  QUESTIONS.forEach((q,i)=>{
    const d=document.createElement("span");
    d.className="dot" + (state[i]==="ok"?" ok":state[i]==="seen"?" seen":"");
    p.appendChild(d);
    if(state[i]) done++;
  });
  $("#count").textContent = done+" / "+QUESTIONS.length;
  $("#finale").classList.toggle("show", done===QUESTIONS.length);
  if(done===QUESTIONS.length){
    setTimeout(()=>$("#finale").scrollIntoView({behavior:"smooth",block:"center"}),350);
  }
}
renderProgress();

/* ---- LINE案内 ---- */
(function initLine(){
  $("#lineText").textContent = LINE_TEXT;
  if(LINE_URL){
    $("#lineBtn").href = LINE_URL;
    $("#lineBox").classList.add("show");
  }else{
    // URL未設定のときは文言だけ表示（ボタンは出さない）
    $("#lineBtn").style.display="none";
    $("#lineBox").classList.add("show");
  }
})();

/* ---- リセット ---- */
$("#resetBtn").addEventListener("click", ()=>{
  if(!confirm("答え合わせの記録をすべて消します。よろしいですか？")) return;
  try{ localStorage.removeItem(KEY); }catch(e){}
  location.reload();
});
</script>
</body>
</html>
